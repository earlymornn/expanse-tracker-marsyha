<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker - 535250148</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Expense Tracker</h2>
    </div>

    <form class="name" id="nameForm">
        <input type="text" id="nameInput" placeholder="Your name">
        <button type="submit">Send</button>
    </form>

    <p id="greeting"></p>

    <div class="new">
        <h3>
            Add New Expenses
        </h3>
    </div>

    <div>
        <p>
            Amount
        </p>
        <input class="amount"  id="amountInput" type="text" placeholder="Type your amount (ex: 2000)">

        <p>
            Category
        </p>
        <select class="amount" id="categoryInput">
            <option value="">Choose category</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="shopping">Shopping</option>
        </select>

        <p>
            Date
        </p>
        <input class="amount" id="dateInput" type="date">
    </div>

    <button class="expensesub" id="expenseSubmit">Submit</button>
</body>

<body>
    <div class="newcontainer">
        <h2>
            Total Expenses
        </h2>
    </div>

    <h4 id="total">
        Total: 0
    </h4>


    <div class="newcontainer">
        <h2>
            History Expenses
        </h2>
    </div>

    <section class="content">
        <article>
            <h1>Amount</h1>
            <div id="amountHistory"></div>
        </article>

        <article>
            <h1>Category</h1>
            <div id="categoryHistory"></div>
        </article>

        <article>
            <h1>Date</h1>
            <div id="dateHistory"></div>
        </article>
    </section>

    <script src="script.js"></script>
</body>
</html>
